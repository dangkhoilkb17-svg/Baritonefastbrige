plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

// The standalone Fabric runtime provides the implementation, while this API
// jar supplies the compile-time interfaces that Loom remaps for Minecraft.
def baritoneApiJar = files('libs/baritone-api-1.11.3.jar')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Compile against the Baritone API; selected interfaces are embedded below.
    compileOnly baritoneApiJar
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from(zipTree(baritoneApiJar.singleFile)) {
        exclude 'META-INF/**'
        exclude 'baritone/api/BaritoneAPI.class'
        exclude 'baritone/api/Settings*.class'
        exclude 'baritone/api/utils/SettingsUtil*.class'
    }
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
