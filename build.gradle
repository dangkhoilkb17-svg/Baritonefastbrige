plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

def baritoneApiPath = providers.gradleProperty('baritone_api_jar')
    .getOrElse('libs/baritone-api-fabric-1.11.3.jar')
def baritoneApiJar = files(baritoneApiPath)
if (!baritoneApiJar.singleFile.exists()) {
    throw new GradleException(
        "Missing Baritone API JAR. Download the official Fabric 1.11.3 artifact " +
        "and place it at '${baritoneApiPath}', or pass -Pbaritone_api_jar=<path>."
    )
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Baritone API Fabric is also the runtime integration mod. Do not use
    // the standalone Baritone jar with this addon.
    modImplementation baritoneApiJar
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
